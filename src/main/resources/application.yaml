ktor:
  application:
    modules:
      - com.bookvault.plugins.HttpKt.configureHttp
      - com.bookvault.plugins.SerializationKt.configureSerialization
      - com.bookvault.routes.RoutingKt.configureRouting
  deployment:
    port: 8080

jwt:
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER}
  audience: ${JWT_AUDIENCE}

database:
  url: ${DB_URL}
  user: ${DB_USER}
  password: ${DB_PASSWORD}